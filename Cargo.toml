[package]
name = "agents"
version = "0.2.50"
edition = "2021"
description = "Multi-machine AI skills sync via a single git repo."
repository = "https://github.com/bjk95/agents"
license = "MIT"
exclude = [
    ".beads/**",
    ".claude/**",
    ".github/**",
    "AGENTS.md",
    "CLAUDE.md",
    "docs/_superpowers/**",
    "site/**",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
serde_json = "1"
gray_matter = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }
flate2 = "1"
tar = "0.4"
directories = "5"
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dialoguer = "0.11"
rand = "0.8"
axoupdater = { version = "0.10.0", default-features = false, features = ["blocking", "github_releases"] }
console = "0.15"
crossterm = "0.28"
indicatif = "0.17"
handlebars = "6"
gethostname = "0.5"
similar = "3"
fs2 = "0.4"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[dev-dependencies]
tempfile = "3.27.0"
