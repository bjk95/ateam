name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        working-directory: site
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Resolve repo base for Pages
        id: base
        run: |
          # GitHub Pages project sites live at https://<owner>.github.io/<repo>/
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          echo "AGENTS_BASE=/${REPO_NAME}/" >> "$GITHUB_ENV"
          echo "AGENTS_SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"

      - name: Build site
        working-directory: site
        env:
          AGENTS_BASE: ${{ env.AGENTS_BASE }}
          AGENTS_SITE_URL: ${{ env.AGENTS_SITE_URL }}
        run: pnpm exec astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
